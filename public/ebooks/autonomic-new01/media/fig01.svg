<svg width="480" height="300" viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="480" height="300" fill="#ffffff"/>
  <rect x="170" y="24" width="140" height="52" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="240" y="47" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">症狀出現</text>
  <text x="240" y="62" text-anchor="middle" font-size="11" fill="#991b1b">心悸、頭暈、胸悶</text>
  <rect x="330" y="112" width="116" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="388" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">就醫檢查</text>
  <text x="388" y="150" text-anchor="middle" font-size="11" fill="#1e40af">想找出原因</text>
  <rect x="170" y="198" width="140" height="52" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="240" y="221" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">檢查正常</text>
  <text x="240" y="236" text-anchor="middle" font-size="11" fill="#166534">器官沒有損傷</text>
  <rect x="34" y="112" width="116" height="52" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="92" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#581c87">困惑加深</text>
  <text x="92" y="150" text-anchor="middle" font-size="11" fill="#6b21a8">明明就是不舒服</text>
  <rect x="136" y="114" width="208" height="48" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="240" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#713f12">這不是心理作用</text>
  <text x="240" y="151" text-anchor="middle" font-size="11" fill="#854d0e">而是調節系統失衡</text>
  <text x="240" y="286" text-anchor="middle" font-size="10" fill="#9ca3af" font-style="italic">▲ 圖A：症狀、檢查與困惑反覆形成循環</text>
  <line x1="282" y1="75" x2="346" y2="113" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="345" y1="163" x2="283" y2="199" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="197" y1="199" x2="135" y2="163" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="134" y1="113" x2="198" y2="75" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#a)"/>
</svg>
