    <style>
      :root {
        color-scheme: light dark;
        --bg: #fdf6ec;
        --bg-soft: #fbeedd;
        --card: #ffffff;
        --ink: #3d2b1a;
        --ink-soft: #7a6248;
        --accent: #e8762c;
        --accent-deep: #c85a12;
        --accent-ink: #ffffff;
        --gold: #f2a81d;
        --line: #f0dcbf;
        --track: #f6e3c8;
        --shadow: 0 10px 30px rgba(146, 90, 20, 0.16);
        --card-shadow: 0 18px 44px rgba(146, 90, 20, 0.22);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #221812;
          --bg-soft: #2c1e14;
          --card: #312218;
          --ink: #f7e8d5;
          --ink-soft: #c9a97f;
          --accent: #f08a3c;
          --accent-deep: #f6a55c;
          --accent-ink: #2a1806;
          --gold: #f5b83d;
          --line: #4d3420;
          --track: #453022;
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
          --card-shadow: 0 18px 44px rgba(0, 0, 0, 0.55);
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "PingFang TC", "PingFang SC", "Microsoft JhengHei", "Noto Sans TC", system-ui, -apple-system, sans-serif;
        background:
          radial-gradient(circle at 12% 8%, var(--bg-soft) 0, transparent 42%),
          radial-gradient(circle at 88% 92%, var(--bg-soft) 0, transparent 40%),
          var(--bg);
        color: var(--ink);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      button { min-height: 3rem; font-family: inherit; cursor: pointer; }

      .wrap {
        max-width: 30rem;
        margin: 0 auto;
        padding: 1.5rem 1.1rem 3rem;
      }

      header { text-align: center; }
      .kicker {
        display: inline-block;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: var(--accent-deep);
        background: var(--bg-soft);
        border: 1.5px solid var(--line);
        padding: 0.3rem 0.85rem;
        border-radius: 999px;
      }
      h1 {
        margin: 0.7rem 0 0.35rem;
        font-size: 2.15rem;
        line-height: 1.2;
        font-weight: 900;
        letter-spacing: 0.02em;
      }
      .sub {
        margin: 0;
        color: var(--ink-soft);
        font-size: 1rem;
        line-height: 1.6;
      }

      /* ---------- 魯魯 ---------- */
      .stage {
        margin-top: 1.4rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .photo-frame {
        position: relative;
        width: min(68vw, 17.5rem);
        aspect-ratio: 1 / 1;
        border-radius: 38% 62% 55% 45% / 48% 42% 58% 52%;
        overflow: hidden;
        border: 5px solid var(--card);
        box-shadow: var(--shadow);
        background: #fff;
      }
      .photo-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 38%;
        display: block;
        transform: scale(1.12);
      }
      .photo-frame.sniffing { animation: sniff-wiggle 0.28s ease-in-out infinite; }
      @keyframes sniff-wiggle {
        0%, 100% { transform: rotate(-2.2deg) translateY(0) scale(1); }
        50% { transform: rotate(2.2deg) translateY(7px) scale(1.035); }
      }
      .sniff-status {
        margin-top: 1rem;
        min-height: 1.7rem;
        font-size: 1.08rem;
        font-weight: 800;
        color: var(--accent-deep);
        letter-spacing: 0.06em;
        text-align: center;
      }
      .sniff-status .dots span { animation: dot-blink 0.9s infinite; display: inline-block; }
      .sniff-status .dots span:nth-child(2) { animation-delay: 0.18s; }
      .sniff-status .dots span:nth-child(3) { animation-delay: 0.36s; }
      @keyframes dot-blink { 0%, 100% { opacity: 0.15; } 50% { opacity: 1; } }

      .btn-main {
        margin-top: 0.6rem;
        border: none;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-ink);
        font-size: 1.28rem;
        font-weight: 900;
        letter-spacing: 0.05em;
        padding: 0.95rem 2.6rem;
        box-shadow: 0 8px 0 var(--accent-deep), var(--shadow);
        transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.15s;
        touch-action: manipulation;
      }
      .btn-main:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--accent-deep), var(--shadow); }
      .btn-main:disabled { opacity: 0.55; cursor: wait; }
      .hint {
        margin-top: 0.9rem;
        font-size: 0.88rem;
        color: var(--ink-soft);
        text-align: center;
      }

      /* ---------- 結果卡（截圖主角） ---------- */
      .result {
        display: none;
        margin-top: 2rem;
        background: var(--card);
        border: 2.5px solid var(--line);
        border-radius: 26px;
        box-shadow: var(--card-shadow);
        overflow: hidden;
      }
      .result.show { display: block; animation: pop-in 0.45s cubic-bezier(0.2, 1.4, 0.4, 1); }
      @keyframes pop-in {
        from { transform: scale(0.92) translateY(14px); opacity: 0; }
        to { transform: scale(1) translateY(0); opacity: 1; }
      }
      .result-top {
        background: var(--bg-soft);
        border-bottom: 2px dashed var(--line);
        padding: 1rem 1.3rem 0.9rem;
        display: flex;
        align-items: center;
        gap: 0.85rem;
      }
      .result-top img {
        width: 3.4rem;
        height: 3.4rem;
        border-radius: 50%;
        object-fit: cover;
        object-position: 50% 30%;
        border: 2.5px solid var(--card);
        box-shadow: var(--shadow);
        background: #fff;
        flex: none;
      }
      .result-top .rt-title { font-weight: 900; font-size: 1.06rem; line-height: 1.3; }
      .result-top .rt-date { color: var(--ink-soft); font-size: 0.86rem; margin-top: 0.1rem; }

      .result-body { padding: 1.25rem 1.3rem 1.35rem; }
      .score-row {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 1rem;
      }
      .score-label { font-size: 0.95rem; font-weight: 800; color: var(--ink-soft); letter-spacing: 0.08em; }
      .score-num {
        font-size: 4.6rem;
        line-height: 0.95;
        font-weight: 900;
        color: var(--accent-deep);
        font-variant-numeric: tabular-nums;
      }
      .score-num small { font-size: 2rem; font-weight: 900; }
      .tier {
        text-align: right;
      }
      .tier .tier-name {
        display: inline-block;
        font-size: 1.22rem;
        font-weight: 900;
        color: var(--accent-ink);
        background: var(--accent);
        padding: 0.42rem 0.95rem;
        border-radius: 999px;
        line-height: 1.25;
      }
      .tier .tier-sub { margin-top: 0.45rem; font-size: 0.86rem; color: var(--ink-soft); }

      .meter {
        margin-top: 1rem;
        height: 1.05rem;
        border-radius: 999px;
        background: var(--track);
        overflow: hidden;
      }
      .meter-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--gold), var(--accent));
        transition: width 1s cubic-bezier(0.25, 1, 0.4, 1);
      }
      .paws {
        margin-top: 0.5rem;
        font-size: 1.05rem;
        letter-spacing: 0.32em;
        color: var(--accent);
        line-height: 1;
      }
      .paws .off { opacity: 0.18; }

      .block { margin-top: 1.3rem; }
      .block h2 {
        margin: 0 0 0.4rem;
        font-size: 0.92rem;
        font-weight: 900;
        letter-spacing: 0.12em;
        color: var(--accent-deep);
        display: flex;
        align-items: center;
        gap: 0.45rem;
      }
      .block p {
        margin: 0;
        font-size: 1.08rem;
        line-height: 1.75;
      }
      .comment-box {
        margin-top: 1.35rem;
        background: var(--bg-soft);
        border-radius: 16px;
        padding: 1rem 1.1rem;
      }
      .comment-box h2 { margin: 0 0 0.35rem; font-size: 0.92rem; font-weight: 900; letter-spacing: 0.12em; color: var(--accent-deep); }
      .comment-box p { margin: 0; font-size: 1.1rem; line-height: 1.75; font-weight: 700; }
      .result-foot {
        margin-top: 1.3rem;
        padding-top: 0.9rem;
        border-top: 2px dashed var(--line);
        text-align: center;
        color: var(--ink-soft);
        font-size: 0.85rem;
        letter-spacing: 0.05em;
      }

      .actions {
        display: none;
        margin-top: 1.2rem;
        gap: 0.7rem;
        flex-wrap: wrap;
      }
      .actions.show { display: flex; }
      .btn-ghost {
        flex: 1 1 9rem;
        border: 2px solid var(--accent);
        background: transparent;
        color: var(--accent-deep);
        border-radius: 999px;
        font-size: 1.02rem;
        font-weight: 800;
        padding: 0.7rem 1rem;
        touch-action: manipulation;
      }
      .btn-ghost:active { transform: scale(0.97); }
      .copied {
        display: none;
        margin-top: 0.8rem;
        text-align: center;
        font-weight: 800;
        color: var(--accent-deep);
        font-size: 0.98rem;
      }
      .copied.show { display: block; }
      .copy-fallback {
        margin-top: 1rem;
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 16px;
        padding: 0.9rem 1rem 1rem;
        text-align: left;
      }
      .copy-fallback[hidden] { display: none; }
      .copy-fallback-hint {
        margin: 0 0 0.6rem;
        font-size: 0.92rem;
        line-height: 1.6;
        font-weight: 800;
        color: var(--accent-deep);
      }
      .copy-fallback textarea {
        width: 100%;
        min-height: 11rem;
        resize: vertical;
        border: 1.5px solid var(--line);
        border-radius: 10px;
        background: var(--bg-soft);
        color: var(--ink);
        font-family: inherit;
        font-size: 0.95rem;
        line-height: 1.65;
        padding: 0.7rem 0.8rem;
      }
      .copy-fallback textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

      @media (prefers-reduced-motion: reduce) {
        .photo-frame.sniffing, .result.show, .sniff-status .dots span { animation: none; }
        .meter-fill { transition: none; }
      }
    </style>

          "給一位朋友傳一張貓的照片，不解釋。這叫傳遞好運。",
          "今天把水喝滿八杯，好運需要水分代謝。",
          "把手機桌布換成任何一隻貓，魯魯不介意你換成他本人。",
          "今天對第一位遇到的店員說謝謝，聲音大聲一點點。",
          "整理一個抽屜就好，好運喜歡藏在整齊的角落。",
          "今天走一次樓梯代替電梯，把好運一步一步踩實。",
          "睡前檢查一遍明天要穿的鞋，這是資深踩屎專家的基本功。",
          "今天買一樣平常捨不得買的小東西，上限一百元，開心無價。",
          "對著窗外深呼吸三次，把昨天的霉味換掉。",
          "今天誇三個人，誇得具體一點，好運會記住你。",
          "把那首在腦中循環的歌完整聽一次，給它一個交代。",
          "今天提早十分鐘出門，狗屎運是留給準時的人的。",
          "睡前摸一下自己的頭說「辛苦了」，魯魯批准這個儀式。",
          "今天買東西時選排隊人少的那一攤，把排隊運留到真正需要的時候。"
        ];

        var INCENSE_LOW = [
          "魯魯燒了一炷香，三長兩短。出門請帶傘，順便帶一點耐心。",
          "香燒到一半，自己滅了。魯魯說：這不是壞運，是老天叫你今天先躺平。",
          "香灰彎腰彎到快斷氣，跟你今天的運勢一樣，需要人扶一下。",
          "三炷香燒出三種速度，魯魯看不懂，只看懂一件事：今天別衝。",
          "香才剛點著就歪向一邊，魯魯搖搖頭：這一局，先讓別人贏。",
          "魯魯燒香求個平安，結果香煙全往他臉上飄——好，今天在家最平安。",
          "香燒得劈哩啪啦像放鞭炮，熱鬧是熱鬧，你在旁邊看就好，別湊過去。",
          "一炷香燒出一個「慢」字，魯魯翻譯：急事緩辦，衰事也會緩緩來，所以先睡飽再說。",
          "香點了三次才點著，魯魯嘆氣：連香都想罷工，你今天就別太拚了。",
          "香灰掉得比魯魯的毛還快。今天出門，眼睛請乖乖放在路面上。"
        ];

        var INCENSE_MID = [
          "魯魯燒了一炷香，不長不短、不歪不直，跟你今天一樣：穩穩過，就是好日子。",
          "香燒到一半，煙往左飄一點又自己回正。魯魯說：小波折會有，結局不差。",
          "香燒得普普通通，沒驚喜也沒驚嚇。魯魯打了個哈欠：平穩，也是一種贏。",
          "三炷香高度差不多，魯魯點頭：今天不用求大贏，不輸就是賺。"
        ];

        var INCENSE_HIGH = [
          "魯魯燒了一炷香，香煙筆直往上，一點都不歪——今天穩了，放心衝。",
          "香燒得又直又旺，魯魯點頭：這個氣勢，可以去買彩券……旁邊那家飲料店。",
          "三炷香整整齊齊一樣高，魯魯說：難得，今天連運氣都排隊聽你的。",
          "香煙筆直衝天，像在對你比讚。魯魯蓋章認證：今日大吉，做什麼都順手。",
          "香灰結成一朵小花，魯魯驚呼：這是好運開花的形狀，今天會有好消息。",
          "一炷香燒得乾淨俐落、不拖泥帶水，跟你的好運一樣——今天穩穩的。",
          "香煙直直往上飄，魯魯瞇眼笑：連風都捨不得吹歪你的運，放心出門吧。",
          "魯魯燒香問運勢，香自己站得直挺挺的——不用問了，今天就是你的場子。"
        ];

        function incenseFor(score) {
          if (score < 50) return pick(INCENSE_LOW);
          if (score >= 70) return pick(INCENSE_HIGH);
          return pick(INCENSE_MID);
        }

        var GAME_URL = "https://surprise-corner.vercel.app/games-static/lulu-sniff-luck.html";
        var frame = document.getElementById("photoFrame");
        var status = document.getElementById("sniffStatus");
        var btn = document.getElementById("sniffBtn");
        var card = document.getElementById("resultCard");
        var actions = document.getElementById("actions");
        var copiedMsg = document.getElementById("copiedMsg");
        var copyFallback = document.getElementById("copyFallback");
        var copyFallbackText = document.getElementById("copyFallbackText");
        var lastResult = null;
        var sniffing = false;

        function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function tierFor(score) {
          for (var i = 0; i < TIERS.length; i++) {
            if (score >= TIERS[i].min) return TIERS[i];
          }
          return TIERS[TIERS.length - 1];
        }

        function todayText() {
          var d = new Date();
          var week = ["日", "一", "二", "三", "四", "五", "六"][d.getDay()];
          return d.getFullYear() + " 年 " + (d.getMonth() + 1) + " 月 " + d.getDate() + " 日 · 星期" + week;
        }

        function pawString(score) {
          var filled = Math.round(score / 20);
          var html = "";
          for (var i = 0; i < 5; i++) {
            html += '<span class="' + (i < filled ? "" : "off") + '">🐾</span>';
          }
          return html;
        }

        function countUp(el, target) {
          var start = null, dur = 900;
          function step(ts) {
            if (!start) start = ts;
            var p = Math.min((ts - start) / dur, 1);
            var eased = 1 - Math.pow(1 - p, 3);
            el.textContent = Math.round(eased * target);
            if (p < 1) requestAnimationFrame(step);
          }
          requestAnimationFrame(step);
        }

        function sniff() {
          if (sniffing) return;
          sniffing = true;
          btn.disabled = true;
          copiedMsg.classList.remove("show");
          copyFallback.hidden = true;
          card.classList.remove("show");
          actions.classList.remove("show");
          frame.classList.add("sniffing");
          status.innerHTML = '魯魯嗅嗅中<span class="dots"><span>。</span><span>。</span><span>。</span></span>';

          var score = Math.floor(Math.random() * 101);
          var tier = tierFor(score);
          lastResult = {
            score: score,
            tier: tier.name,
            prophecy: pick(PROPHECIES),
            task: pick(TASKS),
            incense: incenseFor(score),
            comment: pick(tier.comments)
          };

          setTimeout(function () {
            frame.classList.remove("sniffing");
            status.textContent = "嗅到了！魯魯有話要說：";
            document.getElementById("rtDate").textContent = todayText();
            document.getElementById("tierName").textContent = lastResult.tier;
            document.getElementById("tierSub").textContent = tier.sub;
            document.getElementById("prophecy").textContent = lastResult.prophecy;
            document.getElementById("task").textContent = lastResult.task;
            document.getElementById("incense").textContent = lastResult.incense;
            document.getElementById("comment").textContent = lastResult.comment;
            document.getElementById("paws").innerHTML = pawString(score);
            card.classList.add("show");
            actions.classList.add("show");
            var fill = document.getElementById("meterFill");
            fill.style.width = "0%";
            requestAnimationFrame(function () {
              requestAnimationFrame(function () { fill.style.width = score + "%"; });
            });
            countUp(document.getElementById("scoreNum"), score);
            btn.disabled = false;
            sniffing = false;
            card.scrollIntoView({ behavior: "smooth", block: "nearest" });
          }, 1400);
        }

        btn.addEventListener("click", sniff);
        document.getElementById("againBtn").addEventListener("click", function () {
          window.scrollTo({ top: 0, behavior: "smooth" });
          setTimeout(sniff, 350);
        });
        document.getElementById("copyBtn").addEventListener("click", function () {
          if (!lastResult) return;
          var text = "🐱 魯魯嗅嗅：今日狗屎運\n" +
            todayText() + "\n" +
            "今日狗屎運指數：" + lastResult.score + "%（" + lastResult.tier + "）\n" +
            "🔮 運勢小預言：" + lastResult.prophecy + "\n" +
            "✅ 今日小任務：" + lastResult.task + "\n" +
            "🪔 燒香徵兆：" + lastResult.incense + "\n" +
            "魯魯的評語：" + lastResult.comment + "\n" +
            "🎮 一起來玩：" + GAME_URL;

          copiedMsg.classList.remove("show");
          copyFallback.hidden = true;

          function showSuccess() {
            copyFallback.hidden = true;
            copiedMsg.classList.add("show");
            setTimeout(function () { copiedMsg.classList.remove("show"); }, 2600);
          }

          function showManual(textToShow) {
            copiedMsg.classList.remove("show");
            copyFallbackText.value = textToShow;
            copyFallback.hidden = false;
            // 全選起來，讓使用者直接長按／快捷鍵複製，不用自己拖選
            try {
              copyFallbackText.focus({ preventScroll: false });
              copyFallbackText.select();
              copyFallbackText.setSelectionRange(0, copyFallbackText.value.length);
            } catch (e) {}
            copyFallback.scrollIntoView({ behavior: "smooth", block: "nearest" });
          }

          // 舊式備援：回傳是否真的複製成功，不再無條件當成功
          function legacyCopy() {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.setAttribute("readonly", "");
            ta.style.position = "fixed";
            ta.style.top = "0";
            ta.style.left = "0";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            var ok = false;
            try {
              ta.focus();
              ta.select();
              ta.setSelectionRange(0, ta.value.length);
              ok = document.execCommand("copy");
            } catch (e) {
              ok = false;
            }
            document.body.removeChild(ta);
            return ok === true;
          }

          function tryLegacy() {
            if (legacyCopy()) {
              showSuccess();
            } else {
              showManual(text);
            }
          }

          if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
            navigator.clipboard.writeText(text).then(showSuccess, function () {
              // 新版剪貼簿被拒絕（權限／非安全環境／iframe 限制）→ 走備援
              tryLegacy();
            });
          } else {
            // 沒有新版剪貼簿功能 → 直接走備援
            tryLegacy();
          }
        });
        // 使用者在備援框裡點一下就自動全選，方便手動複製
        copyFallbackText.addEventListener("click", function () {
          try { copyFallbackText.select(); } catch (e) {}
        });
        copyFallbackText.addEventListener("focus", function () {
          try { copyFallbackText.select(); } catch (e) {}
        });
      })();
    </script>
  </body>
</html>
