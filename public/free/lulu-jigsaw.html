<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Lulu's Halloween Puzzle — Free Online Kids Puzzle</title>
<meta name="description" content="A free, cute (not scary!) online puzzle for kids: tap two pieces to swap them and put Lulu the cat back together.">
<meta property="og:title" content="Lulu's Halloween Puzzle — free online kids puzzle">
<meta property="og:description" content="Tap two pieces to swap them. Can you put Lulu back together?">
<meta property="og:image" content="https://surprise-corner.vercel.app/free/img/lulu-jigsaw-halloween.jpg">
<link rel="icon" href="/favicon.ico">
<style>
:root{--bg:#fff7ec;--ink:#4a2410;--accent:#e8731a;--purple:#6b4fd8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;text-align:center}
.wrap{max-width:560px;margin:0 auto;padding:16px 12px 40px}
h1{font-size:clamp(24px,6vw,34px);margin:6px 0}
p{margin:6px 0}
.levels button,.tools button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 18px;margin:4px;background:#ffe3c2;color:var(--ink);cursor:pointer}
.levels button.on{background:var(--accent);color:#fff}
.tools button{background:var(--purple);color:#fff}
#board{--n:3;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;width:min(92vw,520px);aspect-ratio:1/1;margin:14px auto;background:#4a2410;padding:3px;border-radius:14px;touch-action:manipulation}
.tile{background-image:url(/free/img/lulu-jigsaw-halloween.jpg);background-repeat:no-repeat;border-radius:6px;cursor:pointer;transition:transform .12s,box-shadow .12s}
.tile.sel{transform:scale(.93);box-shadow:0 0 0 4px #ffd34d inset}
#board.done{gap:0;padding:0}
#board.done .tile{border-radius:0;cursor:default}
#msg{min-height:34px;font-size:20px;font-weight:700;color:var(--purple)}
.small{font-size:14px;color:#7a4a2a}
a{color:var(--purple)}
.cta{display:inline-block;margin:10px 4px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px;box-shadow:0 4px 0 #b4560e}
#preview{display:none;width:min(92vw,520px);margin:14px auto;border-radius:14px;box-shadow:0 8px 24px rgba(74,36,16,.25)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎃 Lulu's Halloween Puzzle</h1>
  <p>Tap two pieces to swap them.<br>Can you put Lulu back together?</p>
  <div class="levels" id="levels"></div>
  <div id="board" aria-label="puzzle board"></div>
  <img id="preview" src="/free/img/lulu-jigsaw-halloween.jpg" alt="Finished picture: Lulu the white cat in a witch hat">
  <div id="msg"></div>
  <div class="tools"><button id="shuffle">🔀 New game</button><button id="peek">👀 Peek</button></div>
  <p class="small">Moves: <span id="moves">0</span></p>
  <hr style="border:none;border-top:1px dashed #d9b48a;margin:22px 0">
  <p>Love Lulu? Color him too!</p>
  <a class="cta" href="/free/lulu-halloween.html">Free coloring pages</a>
  <p class="small">魯魯萬聖節拼圖（點兩塊交換位置，拼回完整的魯魯）</p>
</div>
<script>
(function(){
  var board=document.getElementById('board'), msg=document.getElementById('msg'), movesEl=document.getElementById('moves');
  var n=3, order=[], sel=-1, moves=0, solved=false;
  var levels=[{n:3,t:'Easy 3×3'},{n:4,t:'Medium 4×4'},{n:5,t:'Hard 5×5'}];
  var lv=document.getElementById('levels');
  levels.forEach(function(l){var b=document.createElement('button');b.textContent=l.t;b.dataset.n=l.n;b.onclick=function(){n=l.n;start();};lv.appendChild(b);});
  function isSolved(){for(var i=0;i<order.length;i++){if(order[i]!==i)return false;}return true;}
  function shuffle(){
    do{order=[];for(var i=0;i<n*n;i++)order.push(i);
      for(var j=order.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var t=order[j];order[j]=order[k];order[k]=t;}
    }while(isSolved());
  }
  function render(){
    board.className=solved?'done':'';board.style.setProperty('--n',n);board.innerHTML='';
    order.forEach(function(piece,pos){
      var d=document.createElement('div');d.className='tile'+(pos===sel?' sel':'');d.dataset.pos=pos;d.dataset.piece=piece;
      var r=Math.floor(piece/n),c=piece%n;
      d.style.backgroundSize=(n*100)+'% '+(n*100)+'%';
      d.style.backgroundPosition=(n>1?c*100/(n-1):0)+'% '+(n>1?r*100/(n-1):0)+'%';
      d.onclick=function(){tap(pos);};board.appendChild(d);
    });
    Array.prototype.forEach.call(lv.children,function(b){b.className=(+b.dataset.n===n)?'on':'';});
    movesEl.textContent=moves;
  }
  function tap(pos){
    if(solved)return;
    if(sel<0){sel=pos;}
    else if(sel===pos){sel=-1;}
    else{var t=order[sel];order[sel]=order[pos];order[pos]=t;sel=-1;moves++;
      if(isSolved()){solved=true;msg.textContent='🎉 You did it! Great job!';}}
    render();
  }
  function start(){moves=0;sel=-1;solved=false;msg.textContent='';shuffle();render();}
  document.getElementById('shuffle').onclick=start;
  var pv=document.getElementById('preview');
  document.getElementById('peek').onclick=function(){pv.style.display=pv.style.display==='block'?'none':'block';};
  window.__lulu={tap:tap,order:function(){return order.slice();},solved:function(){return solved;},n:function(){return n;}};
  start();
})();
</script>
</body>
</html>
